# ==============================================================
# 校园宿舍报修与维修工单派单系统 Nginx 配置
# 统一入口：80 端口
#   静态资源  -> /usr/share/nginx/html/repair  (前端 dist)
#   API 接口  -> http://127.0.0.1:8080
#   图片      -> 由后端 GridFS 提供，统一走 /api/v1/files/
# ==============================================================

upstream repair_backend {
    server 127.0.0.1:8080 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 后端接口限流（防刷）：每 IP 每秒 20 个请求
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
# 登录接口更严格：每 IP 每分钟 10 次
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    access_log  /var/log/nginx/repair_access.log;
    error_log   /var/log/nginx/repair_error.log warn;

    client_max_body_size 8m;
    client_body_buffer_size 1m;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # ---------- 安全响应头 ----------
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------- 图片（必须排在静态资源正则之前） ----------
    location ~ ^/api/v1/files/ {
        proxy_pass http://repair_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        expires 1d;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        include /etc/nginx/conf.d/repair_security_headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # ---------- 前端静态资源 ----------
    root /usr/share/nginx/html/repair;
    index index.html;

    location / {
        # Vue3 history 路由必须回退到 index.html
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/repair_security_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        include /etc/nginx/conf.d/repair_security_headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    # ---------- 登录接口（严格限流，不缓存） ----------
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://repair_backend;
        include /etc/nginx/conf.d/repair_proxy_common.conf;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
    }

    # ---------- AI 智能助手（SSE 流式：必须关闭缓冲/缓存） ----------
    location /api/v1/ai/ {
        # AI 已在应用层按用户限流，这里不叠加 api_limit
        proxy_pass http://repair_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # 流式响应必须关闭缓冲与缓存，否则会被攒包
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # SSE 总超时需大于后端 90s
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # 流式请求不要重试其他上游，避免重复生成/计费
        proxy_next_upstream off;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        include /etc/nginx/conf.d/repair_security_headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ---------- 其余 API 反向代理 ----------
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://repair_backend;
        include /etc/nginx/conf.d/repair_proxy_common.conf;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        include /etc/nginx/conf.d/repair_security_headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ---------- WebSocket 实时通知 ----------
    location /ws/ {
        proxy_pass http://repair_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # token 只能放在 query（?token=xxx），关闭访问日志避免 token 落盘
        access_log off;
    }

    # ---------- 健康检查 ----------
    location = /health {
        access_log off;
        proxy_pass http://repair_backend/actuator/health;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
    }

    # ---------- 错误页 ----------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
